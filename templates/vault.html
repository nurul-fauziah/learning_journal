{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="handwritten">📚 Knowledge Vault</h2>
    <input type="text" id="searchBox" class="form-control w-25" placeholder="Search notes..." onkeyup="filterNotes()">
</div>

<div class="row" id="notesContainer">
    {% for entry in entries %}
    <div class="col-md-4 mb-4 note-item">
        <div class="vintage-card h-100 d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start">
                <span class="badge bg-secondary mb-2">{{ entry.category.name }}</span>
                <small class="text-muted" style="font-size: 0.8rem;">Review in: {{ (entry.next_review - now).days }} days</small>
            </div>
            <h5 class="fw-bold">{{ entry.title }}</h5>
            <p class="text-muted flex-grow-1" style="font-size: 0.9rem;">
                {{ entry.summary[:100] }}...
            </p>
            <div class="mt-2 pt-2 border-top border-secondary">
                <small>Level: <strong>{{ entry.difficulty }}</strong></small>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<script>
function filterNotes() {
    let input = document.getElementById('searchBox').value.toLowerCase();
    let cards = document.getElementsByClassName('note-item');
    
    for (let i = 0; i < cards.length; i++) {
        let title = cards[i].querySelector('h5').innerText.toLowerCase();
        let summary = cards[i].querySelector('p').innerText.toLowerCase();
        if (title.includes(input) || summary.includes(input)) {
            cards[i].style.display = "";
        } else {
            cards[i].style.display = "none";
        }
    }
}
</script>
{% endblock %}
