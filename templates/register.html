{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5">
        <article class="boho-card boho-arch-card p-4 p-md-5 position-relative text-center">
            <!-- Potted Plant Sprout Emblem -->
            <div class="mb-3" aria-hidden="true">
                <svg viewBox="0 0 64 64" width="48" height="48" fill="none">
                    <ellipse cx="32" cy="46" rx="14" ry="10" fill="var(--color-terracotta)"/>
                    <rect x="29" y="32" width="6" height="4" fill="var(--color-mustard)"/>
                    <path d="M32 32 C26 22 16 16 6 18 C12 24 18 26 28 32 Z" fill="var(--color-forest)"/>
                    <path d="M32 32 C38 22 48 16 58 18 C52 24 46 26 36 32 Z" fill="var(--color-sage)"/>
                    <path d="M32 32 C32 18 32 10 32 4 C28 12 28 20 32 32 Z" stroke="var(--color-forest)" stroke-width="2"/>
                </svg>
            </div>

            <span class="boho-pill-label mb-2 d-inline-block">NEW REGISTRATION</span>
            <h1 class="h2 boho-headline mb-1">Create Account</h1>
            <p class="boho-helper-text mb-4">Plant your personal learning space with your private credentials</p>

            {% if error %}
            <div class="alert alert-danger py-2 px-3 mb-3 border-2 text-start" style="border-radius: 12px; background-color: var(--color-blush-soft); border-color: var(--color-terracotta); color: var(--color-aubergine);">
                <strong>Notice:</strong> {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('register') }}" method="POST" class="text-start">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <div class="mb-3">
                    <label class="form-label boho-field-label">Username</label>
                    <input type="text" name="username" class="form-control boho-input" placeholder="Choose a username..." required autocomplete="username" minlength="3" maxlength="30" autofocus>
                    <small class="boho-meta d-block mt-1">Letters, numbers, and underscores only.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label boho-field-label">Password</label>
                    <input type="password" name="password" class="form-control boho-input" placeholder="At least 6 characters..." required autocomplete="new-password" minlength="6">
                </div>

                <div class="mb-4">
                    <label class="form-label boho-field-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control boho-input" placeholder="Repeat your password..." required autocomplete="new-password" minlength="6">
                </div>

                <button type="submit" class="btn btn-boho-primary w-100 py-3 mb-3">
                    <span>Plant Studio Account</span>
                </button>
            </form>

            <div class="pt-3 border-top-boho">
                <p class="boho-meta mb-0">
                    Already have an account? <a href="{{ url_for('login') }}" class="fw-bold" style="color: var(--color-terracotta);">Sign In</a>
                </p>
            </div>
        </article>
    </div>
</div>
{% endblock %}
