<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning Log &mdash; Bibliotheca &amp; Journal</title>
    <!-- Google Fonts: Cormorant Garamond & EB Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="acanthus-body">
    <!-- Ornate Frame Corner Accents (Subtle Page Border Flourishes) -->
    <div class="page-corner page-corner-tl" aria-hidden="true">
        <svg viewBox="0 0 80 80" width="80" height="80">
            <path d="M4,4 L76,4 M4,4 L4,76 M12,12 L68,12 M12,12 L12,68" stroke="var(--color-gold)" stroke-width="1" fill="none" opacity="0.6"/>
            <path d="M12,12 C24,18 32,28 36,44 C34,32 26,24 12,12 Z M12,12 C18,24 28,32 44,36 C32,34 24,26 12,12 Z" fill="var(--color-gold)" opacity="0.4"/>
            <circle cx="12" cy="12" r="2.5" fill="var(--color-gold)"/>
        </svg>
    </div>
    <div class="page-corner page-corner-tr" aria-hidden="true">
        <svg viewBox="0 0 80 80" width="80" height="80">
            <path d="M4,4 L76,4 M76,4 L76,76 M12,12 L68,12 M68,12 L68,68" stroke="var(--color-gold)" stroke-width="1" fill="none" opacity="0.6"/>
            <path d="M68,12 C56,18 48,28 44,44 C46,32 54,24 68,12 Z M68,12 C62,24 52,32 36,36 C48,34 56,26 68,12 Z" fill="var(--color-gold)" opacity="0.4"/>
            <circle cx="68" cy="12" r="2.5" fill="var(--color-gold)"/>
        </svg>
    </div>

    <!-- Classical Acanthus Header Navigation -->
    <header class="acanthus-header">
        <nav class="navbar navbar-expand-lg navbar-dark acanthus-navbar">
            <div class="container d-flex justify-content-between align-items-center">
                <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                    <span class="brand-monogram" aria-hidden="true">
                        <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
                            <circle cx="16" cy="16" r="14" stroke="var(--color-gold)" stroke-width="1.2"/>
                            <path d="M16,6 C13,11 11,14 7,16 C12,17 14,19 16,26 C18,19 20,17 25,16 C21,14 19,11 16,6 Z" fill="var(--color-gold)" opacity="0.85"/>
                            <circle cx="16" cy="16" r="2" fill="var(--color-navy)"/>
                        </svg>
                    </span>
                    <span class="brand-title">My Learning Log</span>
                </a>
                
                <div class="navbar-nav d-flex flex-row gap-4 align-items-center">
                    <a class="nav-link acanthus-nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                    <a class="nav-link acanthus-nav-link" href="{{ url_for('vault') }}">Vault</a>
                    <a class="nav-link acanthus-nav-link" href="{{ url_for('add_entry') }}">Add Note</a>
                </div>
            </div>
        </nav>
        <div class="acanthus-nav-border" aria-hidden="true"></div>
    </header>

    <!-- Main Container -->
    <main class="container py-4 my-2">
        {% block content %}{% endblock %}
    </main>

    <!-- Ornate Footer -->
    <footer class="acanthus-footer text-center py-4 mt-5">
        <div class="cartouche-divider mb-3" aria-hidden="true">
            <span class="divider-line"></span>
            <svg viewBox="0 0 36 20" width="36" height="20" fill="none">
                <path d="M18,2 C12,7 8,9 2,10 C8,11 12,13 18,18 C24,13 28,11 34,10 C28,9 24,7 18,2 Z" fill="var(--color-gold)" opacity="0.75"/>
                <circle cx="18" cy="10" r="1.5" fill="var(--color-navy)"/>
            </svg>
            <span class="divider-line"></span>
        </div>
        <p class="acanthus-colophon mb-0">Ex Libris &bull; Scientia et Memoria</p>
    </footer>

    <!-- Active Reminder Overlay (Regal Botanical Cartouche) -->
    <div id="alarm-overlay" role="dialog" aria-modal="true" aria-labelledby="alarm-heading">
        <div class="alarm-backdrop" onclick="/* preserve focus */"></div>
        <div class="cartouche-card alarm-modal text-center p-4 p-md-5">
            <div class="cartouche-flourish-top" aria-hidden="true">
                <svg viewBox="0 0 160 30" width="160" height="30" fill="none">
                    <path d="M80,2 C65,10 45,12 10,14 C45,16 65,18 80,26 C95,18 115,16 150,14 C115,12 95,10 80,2 Z" fill="var(--color-gold)" opacity="0.65"/>
                    <circle cx="80" cy="14" r="3" fill="var(--color-gold)"/>
                </svg>
            </div>
            
            <div class="alarm-badge mb-2">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="9"/>
                    <polyline points="12 6 12 12 16 14"/>
                    <path d="M12,1 L12,3 M4,3 L6,5 M20,3 L18,5"/>
                </svg>
                <span>Active Recollection</span>
            </div>

            <h2 id="alarm-heading" class="alarm-title mb-3">Recall to Unlock</h2>
            <p class="alarm-subtitle mb-4">To dismiss this reminder, recollect and transcribe the key concept:</p>
            
            <div class="alarm-prompt-frame p-3 mb-4">
                <h4 id="alarm-question" class="mb-0">Retrieving inquiry...</h4>
            </div>

            <div class="mb-3">
                <input type="text" id="alarm-answer" class="form-control acanthus-input text-center" placeholder="Type the recollection keyword..." autocomplete="off">
            </div>

            <button onclick="checkAlarmAnswer()" class="btn btn-cartouche w-100 py-2 fs-6">
                <span>Unlock Manuscript</span>
            </button>
            <p id="alarm-feedback" class="mt-3 mb-0 alarm-feedback-text"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
