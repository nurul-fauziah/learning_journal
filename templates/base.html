<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Journal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        /* Override Bootstrap font untuk kesan handwriting */
        .handwritten { font-family: 'Patrick Hand', cursive; font-size: 1.2rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: transparent; border-bottom: 2px solid var(--text-brown);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📓 My Learning Log</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('vault') }}">Vault</a>
                <a class="nav-link" href="{{ url_for('add_entry') }}">Add Note</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Active Reminder Overlay -->
    <div id="alarm-overlay">
        <h1 class="text-danger mb-4">⏰ WAKE UP & LEARN!</h1>
        <div class="vintage-card text-dark p-5" style="max-width: 500px;">
            <p class="fs-4">To dismiss this alarm, answer this:</p>
            <h3 id="alarm-question" class="mb-3">Loading...</h3>
            <input type="text" id="alarm-answer" class="form-control mb-3" placeholder="Type the keyword/summary...">
            <button onclick="checkAlarmAnswer()" class="btn btn-vintage w-100">Unlock Screen</button>
            <p id="alarm-feedback" class="mt-2 text-danger"></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
